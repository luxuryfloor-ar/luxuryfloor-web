name: Bajar código y archivos originales
on:
  push:
    paths: [".github/workflows/bajar-original.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bajar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar código y archivos desde el servidor anterior
        run: |
          B=https://hpanel.webcodebuilders.com/luxury
          mkdir -p original assets
          for f in home10 home-social-proof2 product-card2 product-info2 description2; do
            curl -fsSL --compressed -o "original/luxury-floor-$f.js" "$B/luxury-floor-$f.js"
          done
          for f in banner-desktop.jfif nosotros.png \
                   cliente1.mp4 cliente2.mp4 cliente3.mp4 cliente4.mp4 cliente5.mp4 \
                   luxury-1.mp4 luxury-2.mp4 luxury-3.mp4 luxury-4.mp4 \
                   testimonio1.jfif testimonio2.jfif testimonio3.jfif testimonio4.jfif \
                   testimonio5.jfif testimonio6.jfif testimonio7.jfif testimonio8.jfif; do
            curl -fsSL -o "assets/$f" "$B/$f" || echo "FALTA $f"
          done
          ls -la original assets
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add original assets
          git diff --cached --quiet || git commit -m "Copia de imágenes y videos del servidor anterior (backup)"
          git push
